<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pediatric Surgery</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --bg:#f6f6f4; --card:#ffffff; --text:#1f1f1d; --muted:#6b6a64; --line:#e2e0d9; --line2:#cfcdc5;
  --ink:#1f1f1d; --onink:#ffffff;
  --green-bg:#e4f2d8; --green:#2f5d0e; --blue-bg:#e1edfa; --blue:#0f4a85; --red-bg:#fbe3e3; --red:#8a1f1f;
  --amber-bg:#fbefd5; --amber:#74450a; --gray-bg:#ecebe6; --gray:#4a4944; --focus:#2b72c8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191918; --card:#232321; --text:#ecebe6; --muted:#a3a198; --line:#33322f; --line2:#46443f;
    --ink:#ecebe6; --onink:#191918;
    --green-bg:#233618; --green:#b8dc97; --blue-bg:#18304a; --blue:#a9cdf2; --red-bg:#471f1f; --red:#f2b4b4;
    --amber-bg:#46330f; --amber:#f2d194; --gray-bg:#33322f; --gray:#cfcdc5; --focus:#6aa6e8;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-weight:500;margin:0}
h2{font-size:18px} h3{font-size:15px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow{flex:1;min-width:0}

button{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
button.primary{background:var(--ink);color:var(--onink);border-color:var(--ink)}
button.danger{border-color:var(--red);color:var(--red)}
button.link{border:none;background:none;padding:2px 4px;min-height:0;color:var(--blue);text-decoration:underline}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=email],select,textarea{
  width:100%;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;min-height:36px}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px}
.field{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);margin:0}
.check input{width:auto;min-height:0}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--onink);padding:10px 16px;border-radius:8px;z-index:99;display:none;max-width:90vw}
#toast.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}

.login{max-width:360px;margin:12vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.topbar-old{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border-color:transparent;background:none}
.nav button.on{background:var(--ink);color:var(--onink)}
.page{padding:14px;max-width:1180px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.tile .n{font-size:22px;font-weight:500}
.tile .l{font-size:12px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pill{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;background:var(--card);cursor:pointer;font-size:13px}
.pill.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--gray-bg);color:var(--gray);margin:2px 4px 2px 0;white-space:nowrap}
.chip.green{background:var(--green-bg);color:var(--green)} .chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.red{background:var(--red-bg);color:var(--red)} .chip.amber{background:var(--amber-bg);color:var(--amber)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line)}
table.tbl th{font-weight:500;text-align:left;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--bg)}
.cards .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card .name{font-weight:500}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.modal{background:var(--card);border-radius:12px;max-width:760px;width:100%;padding:16px;border:1px solid var(--line);margin:auto 0}
.modal.narrow{max-width:460px}
.modal h2{margin-bottom:10px}
.sect{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.sect > h3{margin-bottom:8px}
.log{border-top:1px solid var(--line);padding:6px 0;font-size:13px}
.clrow{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.2fr auto;gap:6px;margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px}
.warnrow{border-left:3px solid var(--amber);padding-left:8px}
.warnrow.high{border-left-color:var(--red)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calh{font-size:12px;color:var(--muted);text-align:center;padding:4px}
.cday{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:4px}
.cday.wk{background:var(--bg)} .cday.today{border-color:var(--focus);border-width:2px} .cday.blank{background:transparent;border:none}
.dn{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.lst{font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:4px 6px;margin-top:4px;cursor:pointer;background:var(--card);line-height:1.3}
.lst.green{background:var(--green-bg);color:var(--green)} .lst.blue{background:var(--blue-bg);color:var(--blue)}
.lst.red{background:var(--red-bg);color:var(--red)} .lst.gray{background:var(--gray-bg);color:var(--gray);text-decoration:line-through}
.barrow{display:grid;grid-template-columns:minmax(80px,38%) 1fr 36px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.barrow .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{background:var(--gray-bg);border-radius:4px;height:10px;display:block}
.bar i{display:block;height:100%;background:var(--focus);border-radius:4px}
.barrow .bn{text-align:right;color:var(--muted)}
.trend{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:130px}
.tcol{display:flex;flex-direction:column;height:100%;justify-content:flex-end}
.tbars{flex:1;display:flex;gap:2px;align-items:flex-end}
.tbars i{flex:1;display:block;min-height:1px;border-radius:2px 2px 0 0}
.tbars .ta{background:var(--gray)} .tbars .td{background:var(--green)}
.tl{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
button:disabled,button.greyed{opacity:.45;cursor:not-allowed}
button.greyed.bk{background:transparent!important;color:#5f9b3d!important;border:1px solid #8fbf72!important;opacity:1!important}
button.greyed.nr{background:transparent!important;color:#c98830!important;border:1px solid #e0b983!important;opacity:1!important}
button[data-send],button.greyed,#a_send{white-space:nowrap}
@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;width:100%;color:#000;background:#fff}
  .noprint{display:none!important}
  .overlay{background:#fff!important;position:static!important}
  .printable table{width:100%;border-collapse:collapse}
  .printable th,.printable td{border:1px solid #000;padding:4px 6px;text-align:left;vertical-align:top}
}

/* ---- app shell (v0.5) ---- */
html,body{height:100%}
.shell{min-height:100vh}
.ico{width:20px;height:20px;flex:none}
.side{display:none}
.main{min-height:100vh}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:600;font-size:17px;min-width:0;white-space:nowrap}
.gsearch{display:flex;align-items:center;gap:6px;flex:1;min-width:0;max-width:460px;margin-left:auto;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:var(--bg)}
.gsearch input{border:none;background:none;outline:none;padding:8px 0;width:100%;min-width:0;font-size:15px;color:var(--text)}
.addbtn{display:flex;align-items:center;gap:6px;white-space:nowrap}
.addbtn span{display:none}
.topmore{display:inline-flex;border-color:transparent;background:none;padding:6px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;border-radius:0;padding:8px 2px 6px;font-size:11px;color:var(--muted);position:relative;min-height:54px}
.tabbar button.on{color:var(--text);font-weight:600}
.tabbar button.on .ico{color:var(--focus)}
.badge:empty{display:none}
.ftoggle{display:none}
.badge{font-style:normal;position:absolute;top:4px;left:calc(50% + 6px);background:#c0392b;color:#fff;border-radius:9px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.page{padding-bottom:84px}
.menulist{display:flex;flex-direction:column;gap:6px}
.menulist button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px}
@media (max-width:699px){
  .ftoggle{display:inline-block;margin:4px 0}
  .fcollapsed{display:none}
  .scrollx{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .scrollx .pill{white-space:nowrap;flex:none}
  .tiles{display:flex;overflow-x:auto;gap:8px}
  .tiles .tile{min-width:112px;flex:none;padding:8px 10px}
  .tiles .tile .n{font-size:20px}
}
@media (min-width:700px){.addbtn span{display:inline}.topmore{display:none}}
@media (min-width:1100px){
  .tabbar{display:none}
  .topmore{display:none}
  .page{padding-bottom:20px}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:214px;background:var(--card);border-right:1px solid var(--line);padding:14px 10px;z-index:35}
  .main{margin-left:214px}
  .brand{display:flex;flex-direction:column;gap:2px;padding:4px 8px 14px}
  .sidenav{display:flex;flex-direction:column;gap:2px;flex:1}
  .sidenav button{display:flex;align-items:center;gap:10px;border-color:transparent;background:none;text-align:left;padding:9px 10px;position:relative}
  .sidenav button:hover{background:var(--gray-bg)}
  .sidenav button.on{background:var(--ink);color:var(--onink)}
  .sidenav .badge{position:static;margin-left:auto}
  .sidefoot{border-top:1px solid var(--line);padding-top:10px}
  .badge[style*="none"]{display:none}
}
@media (max-width:640px){
  .grid2,.grid3{grid-template-columns:1fr}
  .clrow{grid-template-columns:1fr 1fr}
  .page{padding:10px}
  .overlay{padding:0}
  .modal{border-radius:0;min-height:100vh}
}

/* ---- v0.6 waiting list ---- */
.hid{display:none!important}
.constabs{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.constabs .pill{font-size:15px;padding:9px 18px;font-weight:500;border-radius:10px}
.constabs .pill b{font-weight:600;opacity:.65;margin-left:4px}
.constabs .pill.on b{opacity:.85}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.schip{border:1px solid var(--line2);border-radius:20px;padding:5px 12px;background:var(--card);font-size:13px;min-height:0;white-space:nowrap}
.schip b{font-weight:600;margin-right:2px}
.schip.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.fbtn{margin-left:auto}
.afrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.chip.afc{border:1px solid var(--line2);cursor:pointer;background:var(--card);color:var(--text);min-height:0;padding:3px 9px}
.tagbtn{border:none;cursor:pointer;min-height:0;font:inherit;font-size:11px;padding:2px 8px;line-height:1.4}
.tagbtn:hover{filter:brightness(.95);outline:1px solid var(--line2)}
.chip.stbook{background:transparent;color:#4d8a2a;border:1px solid #8fbf72}
.hbtn{border:none;background:none;min-height:0;padding:0;color:var(--muted);font-weight:500;cursor:pointer;font-size:13px}
.hbtn.hs{margin-right:6px}
.hbtn:hover{color:var(--text)}
.hbtn .car{font-size:10px}
.hbtn.fon{color:var(--focus);font-weight:600}
.hbtn.fon::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--focus);margin-left:4px;vertical-align:middle}
table.wl{table-layout:auto}
table.wl th{white-space:normal}
table.wl td:nth-child(2),table.wl td:nth-child(6){white-space:nowrap}
table.wl .chip,table.wl .tagbtn{white-space:normal;text-align:left}
table.wl td{overflow-wrap:break-word}
table.wl td:first-child{min-width:150px}
table.wl td:first-child .mrn,table.wl td:first-child .small{white-space:nowrap}
table.wl td.acts{white-space:nowrap;text-align:right;width:1%;vertical-align:middle}
.actw{display:inline-flex;flex-wrap:nowrap;align-items:center;justify-content:flex-end;gap:6px;white-space:nowrap}
.actw>button:not(.phbtn){min-width:96px}
.actw>button{height:36px;min-height:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;margin:0;box-sizing:border-box}
.actw>.phbtn{width:40px;padding:0}
table.dntbl td:nth-child(7){min-width:150px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 12px}
.ptab{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;min-height:0;font-weight:500;color:var(--muted);cursor:pointer;flex:1}
.ptab.on{color:var(--text);border-bottom-color:var(--focus);font-weight:600}
.psave{position:sticky;bottom:-16px;background:var(--card);display:flex;gap:8px;padding:10px 0 6px;margin-top:12px;border-top:1px solid var(--line);z-index:2}
.wred{color:var(--red);font-weight:600}
.phbtn{padding:5px 9px;min-height:34px}
.phbtn .ico{width:16px;height:16px}
button.btn-sched{white-space:nowrap}
.bignum{font-size:30px;font-weight:600;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:2px 0}
details.fold{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
details.fold>summary{cursor:pointer;font-weight:500;list-style:none;padding:4px 0}
details.fold>summary::before{content:"\25B8  ";color:var(--muted)}
details.fold[open]>summary::before{content:"\25BE  "}
.tagrows{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.tagrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tagrow .f_tnote{max-width:260px}
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.clrow{grid-template-columns:1.2fr 1fr 1fr 1.3fr auto}
.sgrow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:6px;margin-bottom:6px;align-items:center}
.tbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.tbar i{display:block;height:100%;border-radius:4px;background:var(--focus)}
.tbar i.g{background:#4d8a2a} .tbar i.r{background:var(--red)}
.lhdr,.lrow{display:grid;grid-template-columns:96px minmax(150px,1.4fr) 48px minmax(120px,1.5fr) 84px minmax(130px,auto);gap:10px;align-items:start}
.lhdr{font-size:12px;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line2)}
.lrow{padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.lrow:hover{background:var(--bg)}
.lrow.dragging{opacity:.4}
.lrow.ldone{background:var(--green-bg)}
.lno{display:flex;align-items:center;gap:6px}
.lno .arr{display:flex;flex-direction:column;gap:2px}
.mini{padding:0 7px;min-height:20px;font-size:9px;line-height:18px}
.grip{cursor:grab;color:var(--muted);font-size:14px;letter-spacing:-3px}
.lact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cand{display:flex;gap:8px;align-items:flex-start}
.lhead{font-size:15px}
@media (max-width:700px){
  .lhdr{display:none}
  .lrow{grid-template-columns:70px minmax(0,1fr) auto;grid-template-areas:"no pt age" "no pr pr" "ty ty act"}
  .lrow .lno{grid-area:no} .lrow .lpt{grid-area:pt} .lrow .lage{grid-area:age} .lrow .lpr{grid-area:pr} .lrow .lty{grid-area:ty} .lrow .lact{grid-area:act}
  .sgrow{grid-template-columns:1fr auto}
  .sgrow .sg_role{grid-column:1 / -1}
}
.syncbtn{display:block;width:100%;border:none;background:none;min-height:0;padding:4px 0 0;text-align:left;font-size:12px;color:var(--muted);cursor:pointer}
.syncbtn:hover{color:var(--text)}

:root[data-theme="dark"]{
  --bg:#191918; --card:#232321; --text:#ecebe6; --muted:#a3a198; --line:#33322f; --line2:#46443f;
    --ink:#ecebe6; --onink:#191918;
    --green-bg:#233618; --green:#b8dc97; --blue-bg:#18304a; --blue:#a9cdf2; --red-bg:#471f1f; --red:#f2b4b4;
    --amber-bg:#46330f; --amber:#f2d194; --gray-bg:#33322f; --gray:#cfcdc5; --focus:#6aa6e8;
}
:root[data-density="compact"] .tbl td,:root[data-density="compact"] .tbl th{padding-top:4px;padding-bottom:4px}
:root[data-density="compact"] button{min-height:30px;padding:4px 10px}
:root[data-density="compact"] .card{padding:8px 10px}
:root[data-text="large"] body{font-size:17px}
:root[data-text="large"] .small{font-size:13.5px}
/* ---- v0.9.0 ---- */
.ini{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:2px 7px;border-radius:8px;color:#2a2a28;vertical-align:middle}
.swatch{display:inline-block;width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);vertical-align:middle}
.colbtn{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line2)}
.colbtn.on{border-color:var(--text);box-shadow:0 0 0 2px var(--card) inset}
.colbtn:disabled{opacity:.35;cursor:not-allowed}
.top{flex-wrap:wrap}
.consbar{display:flex;gap:4px;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:3px;max-width:100%}
.segwrap{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg{border:none;background:none;border-radius:8px;padding:5px 12px;min-height:30px;font-size:13.5px;white-space:nowrap;flex:none}
.seg.on{background:var(--ink);color:var(--onink)}
.gsearch{max-width:260px}
@media (max-width:699px){
  .top .consbar{order:5;flex:1 1 100%}
  .gsearch{max-width:none}
}
.sttabs{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);margin:4px 0 8px}
.sttabs-in{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.sttab{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;min-height:0;color:var(--muted);white-space:nowrap;flex:none}
.sttab b{font-weight:600;margin-left:3px;opacity:.8}
.sttab.on{color:var(--text);border-bottom-color:var(--ink);font-weight:600}
.fbtn{flex:none;border-radius:18px;padding:4px 14px;min-height:32px}

  var cons = d.consultants.filter(function (c) { return c.Active === 'Y'; });
  var act = d.patients.filter(isActive);
  var counts = {}; act.forEach(function (p) { counts[p.ConsultantId] = (counts[p.ConsultantId] || 0) + 1; });
  $('view').innerHTML =
    '<div class="constabs scrollx" id="conspills"></div><div id="listBody"></div>';
  var cp = $('conspills');
  cp.innerHTML = '<span class="pill' + (S.cons === 'all' ? ' on' : '') + '" data-c="all">All <b>' + act.length + '</b></span>' +
    cons.map(function (c) { return '<span class="pill' + (S.cons === c.Id ? ' on' : '') + '" data-c="' + esc(c.Id) + '">' + esc(c.Name) + ' <b>' + (counts[c.Id] || 0) + '</b></span>'; }).join('');
  on(cp, '.pill', 'click', function (e) { S.cons = e.currentTarget.getAttribute('data-c'); viewList(); });
  listBody();
}

function statusHtml(p) {
  var si = statusInfo(p), h = '';
  if (p.Status === 'Awaiting clearance') {
    var cl = clearances(p), any = false;
    cl.forEach(function (c, i) {
      if (c.state !== 'Requested') return;
      any = true;
      h += '<button type="button" class="chip blue tagbtn" data-clr="' + i + '" data-id="' + esc(p.Id) + '" title="Tap to change">Awaiting ' + esc(c.spec.toLowerCase()) + '</button>';
    });
    if (!any) h = '<span class="chip blue">Awaiting clearance</span>';
    return h;
  }
  if (p.Status === 'Not ready') return '<button type="button" class="chip tagbtn" data-nr="' + esc(p.Id) + '" title="Tap to change">Not ready until ' + esc(fmtDate(p.NotReadyUntil)) + '</button>' + (p.NotReadyReason ? '<br><span class="muted small">' + esc(p.NotReadyReason) + '</span>' : '');
  if (si.booked) return '<span class="chip stbook">' + esc(si.label) + '</span>' + (si.sub ? '<br><span class="muted small">' + esc(si.sub) + '</span>' : '');
  return '<span class="chip ' + si.cls + '">' + esc(si.label) + '</span>';
}
function typeHtml(p) {
  return '<strong>' + careShort(p) + '</strong><br>' + esc(p.Category) + '';
}
function thf(col, label, on_) { return '<th><button type="button" class="hbtn' + (on_ ? ' fon' : '') + '" data-col="' + col + '">' + label + ' <span class="car">&#9662;</span></button></th>'; }
function patientRowsHtml(list) {
  if (!list.length) return '<p class="muted">No patients match.</p>';
  var f = S.f;
  if (useTable()) {
    var sorted = function (k) { return S.sort === k; };
    return '<table class="tbl wl"><thead><tr><th>Patient</th>' +
      thf('age', 'Age', f.age || f.ageFrom !== '' || f.ageTo !== '' || sorted('age')) +
      thf('procedure', 'Procedure', f.proc || sorted('procedure')) +
      '<th><button type="button" class="hbtn hs' + (f.care ? ' fon' : '') + '" data-col="care">DCU/INP <span class="car">&#9662;</span></button> <button type="button" class="hbtn hs' + (f.cat || sorted('category') ? ' fon' : '') + '" data-col="category">Category <span class="car">&#9662;</span></button></th>' +
      thf('status', 'Status', f.chip) +
      thf('wait', 'Wait', f.wait || sorted('wait')) +
      thf('flags', 'Flags', f.flag || f.prio) +
      '<th></th></tr></thead><tbody>' +
      list.map(function (p) {
        return '<tr class="click" data-id="' + esc(p.Id) + '">' +
          '<td>' + (p.Starred ? '<span class="chip amber">★</span>' : '') + '<strong>' + esc(p.Name) + '</strong><br><span class="muted small">' + esc(idShow(p)) + '</span><br><span class="muted small">' + esc(consName(p.ConsultantId)) + '</span></td>' +
          '<td>' + esc(ageText(p.DOB)) + '</td>' +
          '<td>' + esc(procLabel(p)) + '</td>' +
          '<td>' + typeHtml(p) + '</td>' +
          '<td>' + statusHtml(p) + '</td>' +
          '<td class="' + (waitOver(p) ? 'wred' : '') + '">' + esc(waitText(p)) + '</td>' +
          '<td>' + flagsHtml(p) + '</td><td class="acts"><div class="actw"><button type="button" class="phbtn" data-call="' + esc(p.Id) + '" title="Log a call">' + ico('phone') + '</button>' + sendBtn(p) + '</div></td></tr>';
      }).join('') + '</tbody></table>';
  }
  return '<div class="cards">' + list.map(function (p) {
    return '<div class="card" data-id="' + esc(p.Id) + '">' +
      '<div class="spread"><div class="name">' + (p.Starred ? '★ ' : '') + esc(p.Name) + ' <span class="muted small">· ' + esc(ageText(p.DOB)) + '</span></div><div>' + statusHtml(p) + '</div></div>' +
      '<div class="muted small">' + esc(idShow(p)) + ' · ' + esc(consName(p.ConsultantId)) + '</div>' +
      '<div class="small" style="margin-top:2px">' + esc(procLabel(p)) + ' · ' + careShort(p) + ' · ' + esc(p.Category) + '</div>' +
      '<div style="margin-top:4px"><span class="chip' + (waitOver(p) ? ' red' : '') + '">Wait ' + esc(waitText(p)) + '</span>' + flagsHtml(p) + '</div>' +
      '<div class="actw" style="margin-top:6px"><button type="button" class="phbtn" data-call="' + esc(p.Id) + '" title="Log a call">' + ico('phone') + '</button>' + sendBtn(p) + '</div></div>';
  }).join('') + '</div>';
}
function canSend(p) { return p.Status === 'Ready' && !p.ListId && medOf(p) !== 'Unknown'; }
function sendWhy(p) {
  return p.ListId ? 'Already scheduled on an OT list' : p.Status === 'Awaiting clearance' ? 'Not cleared yet' : p.Status === 'Not ready' ? 'Patient is not ready' :
    (p.Status === 'Ready' && medOf(p) === 'Unknown') ? 'Set the medical status first' : '';
}
function sendBtn(p) {
  if (canSend(p)) return '<button class="primary btn-sched" data-send="' + esc(p.Id) + '">Schedule</button>';
  if (isActive(p)) {
    var lbl = p.ListId ? fmtDate(p.ScheduledDate) : (p.Status === 'Ready' ? 'Medical status' : 'Not ready');
    return '<button disabled class="greyed ' + (p.ListId ? 'bk' : 'nr') + '" title="' + esc(sendWhy(p)) + '">' + esc(lbl) + '</button>';
  }
  return '';
}
function flagsHtml(p) {
  var h = '';
  if (p.Priority) h += '<button type="button" class="chip amber tagbtn" data-flag="prio" data-id="' + esc(p.Id) + '" title="' + esc(p.PriorityReason) + '">Priority: ' + esc(p.Priority) + '</button>';
  warnings(p).forEach(function (w) {
    if (w.kind === 'wait') return;
    h += '<button type="button" class="chip tagbtn ' + (w.sev === 'high' ? 'red' : 'amber') + '" data-flag="' + w.kind + '" data-id="' + esc(p.Id) + '">' + esc(w.text) + '</button>';
  });
  return h;
}
function flagAction(p, kind) {
  if (kind === 'contact' || kind === 'calls') dlgCall(p);
  else if (kind === 'clearance') { var cl = clearances(p), i; for (i = 0; i < cl.length; i++) if (cl[i].state === 'Requested') break; dlgClearQuick(p, i < cl.length ? i : 0); }
  else if (kind === 'age14') dlgPriority(p, { adult: true });
  else if (kind === 'age' || kind === 'target' || kind === 'prio') dlgPriority(p, {});
  else if (kind === 'med') dlgMedical(p);
  else openPatient(p.Id);
}
function bindRows(root) {
  on(root, '[data-send]', 'click', function (e) { e.stopPropagation(); dlgSendToList(getP(e.currentTarget.getAttribute('data-send'))); });
  on(root, '[data-call]', 'click', function (e) { e.stopPropagation(); dlgCall(getP(e.currentTarget.getAttribute('data-call'))); });
  on(root, '[data-flag]', 'click', function (e) { e.stopPropagation(); flagAction(getP(e.currentTarget.getAttribute('data-id')), e.currentTarget.getAttribute('data-flag')); });
  on(root, '[data-clr]', 'click', function (e) { e.stopPropagation(); dlgClearQuick(getP(e.currentTarget.getAttribute('data-id')), +e.currentTarget.getAttribute('data-clr')); });
  on(root, '[data-nr]', 'click', function (e) { e.stopPropagation(); dlgNotReadyQuick(getP(e.currentTarget.getAttribute('data-nr'))); });
  on(root, '[data-id]', 'click', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    openPatient(e.currentTarget.getAttribute('data-id'));
  });
}

function activeFilterChips() {
  var f = S.f, out = [];
  function add(label, key, v) { out.push({ label: label, key: key, v: v }); }
  if (f.proc) add('Procedure: ' + (procById(f.proc) ? procById(f.proc).Name : f.proc), 'proc', '');
  if (f.care) add(f.care === 'Inpatient' ? 'INP' : 'DCU', 'care', '');
  if (f.cat) add(f.cat, 'cat', '');
  if (f.age) add('Age: ' + AGE_RANGES.filter(function (x) { return x[0] === f.age; })[0][1], 'age', '');
  if (f.ageFrom !== '' || f.ageTo !== '') add('Age ' + (f.ageFrom !== '' ? f.ageFrom : '0') + ' to ' + (f.ageTo !== '' ? f.ageTo : 'any') + ' y', 'ageFrom', '');
  if (f.wait) add(f.wait === 'over' ? 'Wait over the limit' : 'Wait: ' + WAIT_RANGES.filter(function (x) { return x[0] === f.wait; })[0][1], 'wait', '');
  if (f.flag) add('Flag: ' + FLAG_KINDS.filter(function (x) { return x[0] === f.flag; })[0][1], 'flag', '');
  if (f.lat) add(f.lat === 'Bilateral' ? 'Both' : f.lat, 'lat', '');
  if (f.prio) add('Priority only', 'prio', false);
  if (f.med) add(f.med === 'NotFree' ? 'Not medically free' : (f.med === 'Free' ? 'Medically free' : 'Medical status unknown'), 'med', '');
  return out;
}

function listBody() {
  var base = activeList();
  var counts = { all: base.length, Ready: 0, Booked: 0, 'Awaiting clearance': 0, 'Not ready': 0, Warnings: 0 };
  var byProc = {};
  base.forEach(function (p) {
    if (p.Status === 'Ready') counts[p.ListId ? 'Booked' : 'Ready']++; else counts[p.Status]++;
    byProc[p.Procedure] = (byProc[p.Procedure] || 0) + 1;
    if (warnings(p).length) counts.Warnings++;
  });
  var list = sortList(applyFilters(base));
  var procChips = Object.keys(byProc).sort(function (a, b) { return byProc[b] - byProc[a]; }).map(function (k) {
    return '<span class="pill' + (S.f.proc === k ? ' on' : '') + '" data-proc="' + esc(k) + '">' + esc(k) + ' ' + byProc[k] + '</span>';
  }).join('');
  var chips = [['', 'Waiting', counts.all], ['Ready', 'Ready', counts.Ready], ['Booked', 'Booked', counts.Booked], ['Awaiting clearance', 'Awaiting clearance', counts['Awaiting clearance']], ['Not ready', 'Not ready', counts['Not ready']], ['Warnings', 'Warnings', counts.Warnings]];
  var af = activeFilterChips();
  $('listBody').innerHTML =
    '<div class="chiprow scrollx">' + chips.map(function (c) {
      return '<button type="button" class="schip' + (S.f.chip === c[0] ? ' on' : '') + '" data-chip="' + esc(c[0]) + '"><b>' + c[2] + '</b> ' + esc(c[1]) + '</button>';
    }).join('') + '<button type="button" class="schip fbtn' + (S.f.prio || S.f.med || S.f.ageFrom !== '' || S.f.ageTo !== '' ? ' on' : '') + '" id="fbtn">Filters</button></div>' +
    '<div class="pills scrollx">' + procChips + '</div>' +
    (af.length ? '<div class="afrow">' + af.map(function (x, i) { return '<button type="button" class="chip afc" data-af="' + i + '">' + esc(x.label) + ' &times;</button>'; }).join('') + '<button type="button" class="link" id="fclear">Clear filters</button></div>' : '') +
    patientRowsHtml(list);
  var lb = $('listBody');
  on(lb, '[data-proc]', 'click', function (e) {
    var k = e.currentTarget.getAttribute('data-proc');
    S.f.proc = (S.f.proc === k) ? '' : k;
    listBody();
  });
  on(lb, '[data-chip]', 'click', function (e) { var k = e.currentTarget.getAttribute('data-chip'); S.f.chip = (S.f.chip === k) ? '' : k; listBody(); });
  on(lb, '[data-af]', 'click', function (e) {
    var x = af[+e.currentTarget.getAttribute('data-af')];
    if (x.key === 'ageFrom') { S.f.ageFrom = ''; S.f.ageTo = ''; } else S.f[x.key] = x.v;
    listBody();
  });
  if ($('fclear')) $('fclear').addEventListener('click', function () { clearFilters(); listBody(); });
  $('fbtn').addEventListener('click', dlgFilters);
  on(lb, '[data-col]', 'click', function (e) { e.stopPropagation(); headerMenu(e.currentTarget.getAttribute('data-col')); });
  bindRows(lb);
}

// ---- header menus (tap a column title: sort and filter)
function headerMenu(col) {
  var f = S.f, items = [], title = '', sorts = [];
  function pick(label, on_, fn) { items.push({ label: label, on: on_, fn: fn }); }
  if (col === 'age') {
    title = 'Age'; sorts = [['age', 'asc', 'Youngest first'], ['age', 'desc', 'Oldest first']];
    pick('All ages', !f.age, function () { f.age = ''; });
    AGE_RANGES.forEach(function (r) { pick(r[1], f.age === r[0], function () { f.age = r[0]; f.ageFrom = ''; f.ageTo = ''; }); });
  } else if (col === 'procedure') {
    title = 'Procedure'; sorts = [['procedure', 'asc', 'A to Z'], ['procedure', 'desc', 'Z to A']];
    pick('All procedures', !f.proc, function () { f.proc = ''; });
    S.d.procedures.filter(function (p) { return p.Active === 'Y'; }).forEach(function (pr) { pick(pr.Name, f.proc === pr.Id, function () { f.proc = pr.Id; }); });
  } else if (col === 'care') {
    title = 'DCU or INP'; sorts = [];
    pick('Both', !f.care, function () { f.care = ''; });
    pick('DCU (day-case)', f.care === 'Day-case', function () { f.care = 'Day-case'; });
    pick('INP (inpatient)', f.care === 'Inpatient', function () { f.care = 'Inpatient'; });
  } else if (col === 'category') {
    title = 'Category'; sorts = [['category', 'asc', 'Minor first'], ['category', 'desc', 'Major first']];
    pick('All categories', !f.cat, function () { f.cat = ''; });
    CATS.forEach(function (c) { pick(c, f.cat === c, function () { f.cat = c; }); });
  } else if (col === 'status') {
    title = 'Status'; sorts = [];
    [['', 'All'], ['Ready', 'Ready (not yet scheduled)'], ['Booked', 'Booked'], ['Awaiting clearance', 'Awaiting clearance'], ['Not ready', 'Not ready']].forEach(function (r) { pick(r[1], f.chip === r[0], function () { f.chip = r[0]; }); });
  } else if (col === 'wait') {
    title = 'Wait'; sorts = [['wait', 'desc', 'Longest first'], ['wait', 'asc', 'Shortest first']];
    pick('Any wait', !f.wait, function () { f.wait = ''; });
    pick('Over the limit', f.wait === 'over', function () { f.wait = 'over'; });
    WAIT_RANGES.forEach(function (r) { pick(r[1], f.wait === r[0], function () { f.wait = r[0]; }); });
  } else if (col === 'flags') {
    title = 'Flags'; sorts = [['priority', 'asc', 'Priority and warnings first']];
    pick('All', !f.flag, function () { f.flag = ''; });
    FLAG_KINDS.forEach(function (r) { pick(r[1], f.flag === r[0], function () { f.flag = r[0]; }); });
  }
  var m = openModal('<div class="spread"><h2>' + esc(title) + '</h2><button id="hm_x">Close</button></div>' +
    (sorts.length ? '<div class="row" style="margin-bottom:8px">' + sorts.map(function (s, i) { return '<button type="button" data-s="' + i + '"' + (S.sort === s[0] && S.sortDir === s[1] ? ' class="primary"' : '') + '>' + esc(s[2]) + '</button>'; }).join('') + '</div>' : '') +
    '<div class="menulist">' + items.map(function (it, i) { return '<button type="button" data-i="' + i + '"' + (it.on ? ' class="primary"' : '') + '>' + esc(it.label) + '</button>'; }).join('') + '</div>', { narrow: true });
  $('hm_x').addEventListener('click', m.close);
  on(m.el, '[data-s]', 'click', function (e) { var s = sorts[+e.currentTarget.getAttribute('data-s')]; S.sort = s[0]; S.sortDir = s[1]; m.close(); listBody(); });
  on(m.el, '[data-i]', 'click', function (e) { items[+e.currentTarget.getAttribute('data-i')].fn(); m.close(); listBody(); });
}

function dlgFilters() {
  var f = S.f;
  var m = openModal('<div class="spread"><h2>Filters</h2><button id="fl_x">Close</button></div>' +
    '<div class="field"><label for="fl_med">Medical status</label><select id="fl_med">' + opt('', 'Any', !f.med) + opt('Free', 'Medically free', f.med === 'Free') + opt('NotFree', 'Not medically free', f.med === 'NotFree') + opt('Unknown', 'Unknown', f.med === 'Unknown') + '</select></div>' +
    '<div class="grid2"><div class="field"><label for="fl_af">Age from (years)</label><input type="number" id="fl_af" min="0" value="' + esc(f.ageFrom) + '"></div>' +
    '<div class="field"><label for="fl_at">Age up to (years)</label><input type="number" id="fl_at" min="0" value="' + esc(f.ageTo) + '"></div></div>' +
    '<label class="check"><input type="checkbox" id="fl_pr"' + (f.prio ? ' checked' : '') + '> Priority patients only</label>' +
    '<div class="row" style="margin-top:12px"><button class="primary" id="fl_ok">Apply</button><button id="fl_clr">Clear all filters</button></div>', { narrow: true });
  $('fl_x').addEventListener('click', m.close);
  $('fl_ok').addEventListener('click', function () {
    f.med = val('fl_med'); f.ageFrom = val('fl_af'); f.ageTo = val('fl_at'); f.prio = checked('fl_pr');
    if (f.ageFrom !== '' || f.ageTo !== '') f.age = '';
    m.close(); listBody();
  });
  $('fl_clr').addEventListener('click', function () { clearFilters(); m.close(); listBody(); });
}

// ---- quick windows opened from the list: call log, clearance, priority, medical status
function patchAndRefresh(payload, msg, closeFn) {
  return call('patchPatient', payload).then(function (r) {
    upsertP(r.patient); if (closeFn) closeFn(); render(); toast(msg);
    if (r.patient.Status === 'Awaiting clearance' && payload.Clearances !== undefined && getP(payload.patientId)) { /* status updated by server */ }
  }).catch(fail);
}
function dlgCall(p) {
  if (!p) return;
  var nums = [p.Guardian, p.Guardian2].filter(Boolean);
  var outcome = 'Called - reached';
  var OUT = [['Called - reached', 'Answered'], ['Called - no answer', 'No answer'], ['Called - call back later', 'Call back later'], ['Called - wrong number', 'Wrong number']];
  var m = openModal('<div class="spread"><h2>' + esc(p.Name) + '</h2><button id="cl_x">Close</button></div>' +
    '<p class="muted small" style="margin:0 0 8px">' + esc(idShow(p)) + ' · ' + esc(consName(p.ConsultantId)) + '</p>' +
    (nums.length ? nums.map(function (n) { return '<div class="bignum">' + esc(phoneText(n)) + '</div>'; }).join('') : '<p class="muted">No contact number recorded.</p>') +
    '<p class="small" id="cl_last" style="margin:8px 0">Loading last contact…</p>' +
    '<div class="row" id="cl_out" style="margin-bottom:10px">' + OUT.map(function (o, i) { return '<button type="button" data-o="' + i + '"' + (i === 0 ? ' class="primary"' : '') + '>' + esc(o[1]) + '</button>'; }).join('') + '</div>' +
    '<div class="field"><label for="cl_note">Note (optional)</label><input type="text" id="cl_note" placeholder="Sick, call back in 2 weeks"></div>' +
    '<div class="row"><button class="primary" id="cl_save">Save to log</button><button id="cl_nr">Mark not ready…</button></div>', { narrow: true });
  $('cl_x').addEventListener('click', m.close);
  on(m.el, '[data-o]', 'click', function (e) {
    var i = +e.currentTarget.getAttribute('data-o'); outcome = OUT[i][0];
    var bs = m.el.querySelectorAll('[data-o]'); for (var k = 0; k < bs.length; k++) bs[k].classList.toggle('primary', k === i);
  });
  $('cl_nr').addEventListener('click', function () { dlgNotReady(p, m); });
  $('cl_save').addEventListener('click', function () {
    $('cl_save').disabled = true;
    call('addContact', { patientId: p.Id, type: outcome, date: S.today, note: val('cl_note') }).then(function (r) {
      upsertP(r.patient); m.close(); render(); toast('Call saved');
    }).catch(function (e) { $('cl_save').disabled = false; fail(e); });
  });
  call('getContacts', { patientId: p.Id }).then(function (list) {
    var c = list.filter(function (x) { return x.Type.indexOf('Called') === 0; })[0];
    var t = $('cl_last'); if (!t) return;
    t.textContent = c ? 'Last call: ' + c.Type.replace('Called - ', '') + ', ' + fmtDate(c.Date) + (Number(p.CallCount) > 0 ? ' · ' + p.CallCount + ' unanswered in a row' : '') : 'No calls logged yet.';
  }).catch(function () { var t = $('cl_last'); if (t) t.textContent = ''; });
}
function dlgClearQuick(p, idx) {
  if (!p) return;
  var cl = clearances(p), c = cl[idx];
  if (!c) { openPatient(p.Id); return; }
  var docs = specConsultants(c.spec);
  var m = openModal('<div class="spread"><h2>' + esc(c.spec) + ' review</h2><button id="cq_x">Close</button></div>' +
    '<p class="muted small" style="margin:0 0 10px">' + esc(p.Name) + ' · ' + esc(idShow(p)) + '</p>' +
    (c.spec !== 'Anesthesia' ? '<div class="field"><label for="cq_doc">Consultant</label><select id="cq_doc">' + opt('', 'Not chosen', !c.doctor) + docs.map(function (d) { return opt(d.Name, d.Name, d.Name === c.doctor); }).join('') + (c.doctor && !docs.some(function (d) { return d.Name === c.doctor; }) ? opt(c.doctor, c.doctor, true) : '') + '</select></div>' : '') +
    '<div class="field"><label for="cq_date">Appointment date</label><input type="date" id="cq_date" value="' + esc(c.apptDate || '') + '"></div>' +
    '<div class="row"><button class="primary" id="cq_ok">Cleared</button><button id="cq_save">Save changes</button><button id="cq_del" class="danger">Remove review</button></div>', { narrow: true });
  $('cq_x').addEventListener('click', m.close);
  function save(state, note) {
    var arr = clearances(p);
    arr[idx] = { spec: c.spec, state: state, apptDate: val('cq_date'), doctor: $('cq_doc') ? val('cq_doc') : '' };
    patchAndRefresh({ patientId: p.Id, Clearances: JSON.stringify(arr), logNote: note }, state === 'Cleared' ? c.spec + ' cleared' : 'Saved', m.close);
  }
  $('cq_ok').addEventListener('click', function () { save('Cleared', c.spec + ' cleared'); });
  $('cq_save').addEventListener('click', function () { save('Requested', ''); });
  $('cq_del').addEventListener('click', function () {
    var arr = clearances(p); arr.splice(idx, 1);
    patchAndRefresh({ patientId: p.Id, Clearances: JSON.stringify(arr), logNote: c.spec + ' review removed' }, 'Review removed', m.close);
  });
}
function dlgNotReadyQuick(p) {
  if (!p) return;
  var m = openModal('<div class="spread"><h2>Not ready</h2><button id="nq_x">Close</button></div>' +

    '<div class="psave"><button class="primary" id="f_save">' + (isNew ? 'Add to list' : 'Save changes') + '</button><button id="f_cancel">Cancel</button></div>';

  var m = openModal(html);
  var cl = p ? clearances(p) : [];
  function showTab(n) {
    var bs = m.el.querySelectorAll('.ptab'), ps = m.el.querySelectorAll('.ptp'), i;
    for (i = 0; i < bs.length; i++) bs[i].className = 'ptab' + (bs[i].getAttribute('data-pt') === String(n) ? ' on' : '');

    var sc = m.el.querySelector('.ptabs'); if (sc && sc.scrollIntoView && n !== 1) { /* keep header visible */ }
  }
  on(m.el, '.ptab', 'click', function (e) { showTab(e.currentTarget.getAttribute('data-pt')); });
  function targetHint() {
    var pr = procById($('f_proc').value), bits = [];
    var w = pr && Number(pr.TargetDays) ? Number(pr.TargetDays) : (Number(S.d.settings['waitDays' + $('f_cat').value]) || 0);
    $('f_twd').placeholder = w ? String(w) : 'none';

    if (w) bits.push('wait ' + w + ' days'); if (pr && Number(pr.MaxAgeMonths)) bits.push('done before age ' + pr.MaxAgeMonths + ' months');
    $('f_thint').textContent = 'Leave empty to use the default' + (bits.length ? ' (' + bits.join(', ') + ')' : ' (none set for this procedure)') + '. Defaults are set in Settings, Procedures.';
  }

  function readCl() {
    var rows = m.el.querySelectorAll('.clrow'), out = [];

      });

  }
  function drawCl() {
    $('f_cl').innerHTML = cl.map(function (c, i) {

      return '<div class="clrow">' +
        '<select class="cl_spec">' + SPECIALTIES.map(function (s) { return opt(s, s, s === c.spec); }).join('') + '</select>' +
        '<select class="cl_state">' + opt('Requested', 'Not cleared', c.state !== 'Cleared') + opt('Cleared', 'Cleared', c.state === 'Cleared') + '</select>' +
        '<input type="date" class="cl_date" title="Appointment date" value="' + esc(c.apptDate || '') + '">' + docSel +

      var i = Array.prototype.indexOf.call(m.el.querySelectorAll('.cl_spec'), e.currentTarget);
      cl = readCl(); if (cl[i]) cl[i].doctor = ''; drawCl();

  }
  drawCl();
  var ex = p ? extras(p) : [];
  function readEx() {
    var rows = m.el.querySelectorAll('.exrow'), out = [];

      var r = rows[i], sel = r.querySelector('.ex_proc'), pr = procById(sel.value);

        '<select class="ex_lat">' + opt('', 'Side', !x.laterality) + ['Right', 'Left', 'Bilateral'].map(function (z) { return opt(z, z, x.laterality === z); }).join('') + '</select>' +

  function checkedTags() {

  function medChanged() {

    } else {
      var other = checkedTags().some(function (x) { return tagSpec(x) === spec; });

  function priceChanged() {

  }
  function sponsorHint() { $('f_sponsorhint').textContent = $('f_spons').value === 'Self-payment' ? 'No exemption records' : ''; }
  $('f_proc').addEventListener('change', function () { procChanged(true); });

    var o = {
      Id: p ? p.Id : '', Name: val('f_name'), MRN: val('f_mrn'), DOB: val('f_dob'), Sex: val('f_sex'), Guardian: val('f_guard'), Guardian2: val('f_guard2'),
      ConsultantId: val('f_cons'), SeenByConsultant: val('f_seen'), DateAdded: val('f_added'),
      ProcedureId: pr ? sel : '', Procedure: pr ? pr.Name : (sel === '__other' ? val('f_procother') : ''),
      Laterality: $('r_lat').style.display === 'none' ? '' : val('f_lat'),
      Diagnosis: val('f_dx'), Category: val('f_cat'), CareType: val('f_care'),
      NeedsAdmission: checked('f_admit') ? 'Y' : '', TargetWaitDays: val('f_twd'), TargetAgeMonths: val('f_tam'),
      MedicalStatus: med, Tags: tagList.join(','), TagNotes: JSON.stringify(notes),
      Clearances: JSON.stringify(readCl().filter(function (c) { return c.spec; })),
      Priority: val('f_prio'), PriorityReason: val('f_prior'), Sponsorship: val('f_spons'),

    };

    function send(extra) {
      call('savePatient', Object.assign({}, o, extra || {})).then(function (saved) {

      }).catch(function (e) {

          $('f_save').disabled = false; return;
        }
        $('f_save').disabled = false; showTab(1); fail(e);
      });

      }).join('') : '<p class="muted small">No entries yet.</p>';

      } else { h += '<button id="a_restore">Restore to waiting list</button>'; }

      if (cur.ListId && listById(cur.ListId)) info = 'On the theatre list of ' + fmtDay(listById(cur.ListId).Date) + ' (' + listTitle(listById(cur.ListId)) + '). ';

// ---------------------------------------------------------------- calendar and theatre lists
function viewCalendar() {
  var m = S.calMonth || S.today.slice(0, 7);
  S.calMonth = m;
  var y = +m.slice(0, 4), mo = +m.slice(5, 7);
  var startDow = new Date(Date.UTC(y, mo - 1, 1)).getUTCDay();
  var dim = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  var byDate = {}, clash = {};
  (S.d.lists || []).forEach(function (l) {
    if (l.Date.slice(0, 7) === m) (byDate[l.Date] = byDate[l.Date] || []).push(l);
    if (l.Status === 'Open' && l.RoomId) { var k = l.Date + '|' + l.RoomId; clash[k] = (clash[k] || 0) + 1; }
  });
  function block(l) {
    var u = listUsed(l);
    var cls = l.Status !== 'Open' ? 'gray' : (u.n === 0 ? '' : 'blue');
    var line2 = l.Status !== 'Open' ? 'Cancelled' : (u.n + (u.n === 1 ? ' case' : ' cases') + (l.RoomId && clash[l.Date + '|' + l.RoomId] > 1 ? ' · room clash' : ''));
    return '<div class="lst ' + cls + '" data-list="' + esc(l.Id) + '"><strong>' + esc(consName(l.ConsultantId)) + '</strong>' + (l.RoomId ? ' · ' + esc(roomName(l.RoomId)) : '') + '<br><span class="small">' + esc(line2) + '</span></div>';
  }
  var body = '';
  if (window.innerWidth >= 760) {
    body = '<div class="calgrid">' + WD.map(function (d) { return '<div class="calh">' + d + '</div>'; }).join('');
    for (var i = 0; i < startDow; i++) body += '<div class="cday blank"></div>';
    for (var d = 1; d <= dim; d++) {
      var ds = m + '-' + ('0' + d).slice(-2), dow = (startDow + d - 1) % 7;
      body += '<div class="cday' + (ds === S.today ? ' today' : '') + (dow === 5 || dow === 6 ? ' wk' : '') + '"><div class="dn"><span>' + d + '</span><button class="link" data-add="' + ds + '" aria-label="Add a list on ' + ds + '">+</button></div>' +
        (byDate[ds] || []).map(block).join('') + '</div>';
    }
    body += '</div>';
  } else {
    var days = Object.keys(byDate).sort();
    body = days.length ? days.map(function (ds) {
      return '<div class="panel"><div class="spread"><strong>' + esc(fmtDay(ds)) + '</strong><button class="link" data-add="' + ds + '">Add list</button></div>' + byDate[ds].map(block).join('') + '</div>';
    }).join('') : '<p class="muted">No lists this month.</p>';
  }
  $('view').innerHTML =
    '<div class="spread"><h2>Calendar</h2><div class="row"><button class="primary" id="cal_add">Add list</button></div></div>' +
    '<div class="row" style="margin:8px 0"><button id="cal_prev" aria-label="Previous month">&lsaquo;</button><strong style="min-width:150px;text-align:center">' + LONGM[mo - 1] + ' ' + y + '</strong><button id="cal_next" aria-label="Next month">&rsaquo;</button><button id="cal_today">Today</button></div>' +
    '<p class="muted small">Each block is one consultant\'s list: name, room, cases and minutes used of the list length. Tap a block to build or review the list.</p>' + body;
  function shift(n) {
    var t = new Date(Date.UTC(y, mo - 1 + n, 1));
    S.calMonth = t.getUTCFullYear() + '-' + ('0' + (t.getUTCMonth() + 1)).slice(-2);
    viewCalendar();
  }
  $('cal_prev').addEventListener('click', function () { shift(-1); });
  $('cal_next').addEventListener('click', function () { shift(1); });
  $('cal_today').addEventListener('click', function () { S.calMonth = S.today.slice(0, 7); viewCalendar(); });
  $('cal_add').addEventListener('click', function () { listForm(null, m === S.today.slice(0, 7) ? S.today : m + '-01'); });
  on($('view'), '[data-list]', 'click', function (e) { openList(e.currentTarget.getAttribute('data-list')); });
  on($('view'), '[data-add]', 'click', function (e) { e.stopPropagation(); listForm(null, e.currentTarget.getAttribute('data-add')); });
}

// ---------------------------------------------------------------- dashboard and yearly summary
function countBy(list, fn) { var o = {}; list.forEach(function (p) { var k = fn(p) || '(none)'; o[k] = (o[k] || 0) + 1; }); return o; }
function barsHtml(o, max) {
  var keys = Object.keys(o).sort(function (a, b) { return o[b] - o[a]; });
  if (!keys.length) return '<p class="muted small">Nothing yet.</p>';
  var top = max || o[keys[0]] || 1;
  return keys.map(function (k) {
    return '<div class="barrow"><span class="bl">' + esc(k) + '</span><span class="bar"><i style="width:' + Math.max(2, Math.round(o[k] / top * 100)) + '%"></i></span><span class="bn">' + o[k] + '</span></div>';
  }).join('');
}
function monthKey(s) { return s ? s.slice(0, 7) : ''; }
function viewDashboard() {
  var d = S.d, cons = d.consultants.filter(function (c) { return c.Active === 'Y'; });
  var all = d.patients.filter(function (p) { return S.dashCons === 'all' || p.ConsultantId === S.dashCons; });
  var act = all.filter(isActive), done = all.filter(function (p) { return p.Status === 'Done'; });
  var booked = act.filter(function (p) { return p.ListId; }).length;
  var ready = act.filter(function (p) { return p.Status === 'Ready' && !p.ListId; }).length;
  var over = act.filter(waitOver).length;
  var buckets = { '0 to 30 days': 0, '31 to 90 days': 0, '91 to 180 days': 0, '181 to 365 days': 0, 'Over a year': 0 };
  act.forEach(function (p) { var w = waitDays(p); buckets[w <= 30 ? '0 to 30 days' : w <= 90 ? '31 to 90 days' : w <= 180 ? '91 to 180 days' : w <= 365 ? '181 to 365 days' : 'Over a year']++; });
  var end = addDaysStr(S.today, 28);
  var up = d.lists.filter(function (l) { return l.Status === 'Open' && l.Date >= S.today && l.Date <= end && (S.dashCons === 'all' || l.ConsultantId === S.dashCons); });
  var nCases = 0, empty = 0;
  up.forEach(function (l) { var u = listUsed(l); nCases += u.n; if (!u.n) empty++; });
  var months = [], t = S.today.slice(0, 7);
  for (var i = 11; i >= 0; i--) { var y = +t.slice(0, 4), mo = +t.slice(5, 7) - i; while (mo < 1) { mo += 12; y--; } months.push(y + '-' + ('0' + mo).slice(-2)); }
  var addedM = countBy(all.filter(function (p) { return p.DateAdded; }), function (p) { return monthKey(p.DateAdded); });
  var doneM = countBy(done.filter(function (p) { return p.DoneDate; }), function (p) { return monthKey(p.DoneDate); });
  var tmax = 1; months.forEach(function (k) { tmax = Math.max(tmax, addedM[k] || 0, doneM[k] || 0); });
  var trend = '<div class="trend">' + months.map(function (k) {
    return '<div class="tcol"><div class="tbars"><i class="ta" style="height:' + Math.round((addedM[k] || 0) / tmax * 100) + '%" title="Added ' + (addedM[k] || 0) + '"></i><i class="td" style="height:' + Math.round((doneM[k] || 0) / tmax * 100) + '%" title="Done ' + (doneM[k] || 0) + '"></i></div><div class="tl">' + MONTHS[+k.slice(5) - 1] + '</div></div>';
  }).join('') + '</div><p class="muted small"><span class="chip">Added</span> <span class="chip green">Done</span> per month, last 12 months</p>';
  // cases per surgeon this year
  var yr = S.today.slice(0, 4), per = {};
  done.forEach(function (p) {
    if ((p.DoneDate || '').slice(0, 4) !== yr) return;
    surgeonsOf(p).forEach(function (x) { var o = per[x.name] = per[x.name] || { primary: 0, assist: 0 }; if (x.role === 'Primary surgeon') o.primary++; else o.assist++; });
  });

    st.sheets.forEach(function (sh) { if (!sh.include || !sh.kind) return; impChunks(dataRows(sh), st.source === 'paste' ? 100 : 150).forEach(function (p) { jobs.push({ sh: sh, rows: p }); total += p.length; }); });
    var doneRows = 0, summary = { new: 0, update: 0, unchanged: 0, problem: 0 }, problems = [], k = 0, lists = 0;
    $('im_body').innerHTML = '<h2>Importing…</h2><div class="progress"><div class="bar" id="im_bar" style="height:10px;background:var(--accent,#2b6cb0);width:0%;border-radius:5px"></div></div><p class="muted small" id="im_pt">0 of ' + total + ' rows</p><p class="muted small">Keep this window open. If the connection drops, open Import again and import the same file: nothing is duplicated.</p>';
    function next() {
      if (k >= jobs.length) return Promise.resolve();
      var j = jobs[k++];
      return callChunk(j.sh, j.rows, false).then(function (r) {
        Object.keys(r.counts).forEach(function (q) { summary[q] += r.counts[q]; });
        lists += r.listsMade || 0;
        r.items.forEach(function (i) { if (i.action === 'problem') problems.push([j.sh.name, i.n, i.name, i.mrn, i.procedure, i.reason]); });
        doneRows += j.rows.length;
        if ($('im_bar')) { $('im_bar').style.width = Math.round(doneRows / total * 100) + '%'; $('im_pt').textContent = doneRows + ' of ' + total + ' rows'; }
        return next();
      });
    }
    next().then(function () { return load(); }).then(function () {
      $('im_body').innerHTML = '<h2>Import finished</h2><p><strong>' + summary.new + '</strong> added, <strong>' + summary.update + '</strong> updated, ' + summary.unchanged + ' unchanged, <strong>' + summary.problem + '</strong> not imported' + (lists ? '; ' + lists + ' theatre list(s) created' : '') + '.</p>' +
        (problems.length ? '<p class="small">Rows not imported (first 15):<br>' + problems.slice(0, 15).map(function (p) { return esc(p[0]) + ' row ' + esc(p[1]) + ': ' + esc(p[5]); }).join('<br>') + '</p><button id="im_dl">Download the problem list (Excel)</button> ' : '') +
        '<p class="muted small">Imported patients carry a small "xls" tag until their missing data is completed. The waiting list, Done and Removed pages have an "xls" filter.</p><button class="primary" id="im_ok">Close</button>';
      if ($('im_dl')) $('im_dl').addEventListener('click', function () { exportXlsx('import-problems', [{ name: 'Not imported', rows: [['Sheet', 'Row', 'Name', 'CPR / T number', 'Procedure', 'Reason']].concat(problems) }]); });
      $('im_ok').addEventListener('click', function () { m.close(); render(); });
    }).catch(function (e) { fail(e); step2(); });
  }
  step1();
};


// ---- v0.12.0: dates without lists (Settings > Operating rooms)
function skipDates() { try { var a = JSON.parse((S.d.settings || {}).otSkipDates || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
(function () {
  var oldDraw2 = drawSetPanel;
  drawSetPanel = function () {
    oldDraw2();
    if ((S.setTab !== 'rooms' && S.setTab !== 'consultants') || !$('s_main')) return;
    var box = document.createElement('div'); box.className = 'sect'; box.id = 'sk_box';
    $('s_main').appendChild(box);
    function paint() {
      var l = skipDates().filter(function (x) { return x.date >= S.today; });
      box.innerHTML = '<h3>Theatre lists are created automatically</h3><p class="muted small">Press Refresh schedule after changing operating days or rooms. Lists with patients are never touched. Every consultant gets a list on their operating day, and each shared room on its day, for the next 6 months. The lists are topped up every night. Dates below get no list (holidays, leave). Lists that already hold patients, and lists you added yourself, are never changed or removed.</p>' +
        '<div class="row"><input type="date" id="sk_date" style="max-width:170px"><input type="text" id="sk_note" placeholder="Note (optional)" style="max-width:220px"><button id="sk_add">Add date</button><button id="sk_fill">Refresh schedule</button></div>' +
        '<div id="sk_list" style="margin-top:8px">' + (l.length ? l.map(function (x) { return '<div class="spread log"><span>' + esc(fmtDate(x.date)) + (x.note ? ' <span class="muted small">' + esc(x.note) + '</span>' : '') + '</span><button data-skd="' + esc(x.date) + '">Remove</button></div>'; }).join('') : '<p class="muted small">No dates without lists.</p>') + '</div>';
      function save(arr) {
        call('saveSkipDates', { dates: arr }).then(function (r) { S.d.settings.otSkipDates = JSON.stringify(r.skip); S.d.lists = r.lists; paint(); toast(r.removed ? r.removed + ' empty list(s) removed' : 'Saved'); }).catch(fail);
      }
      $('sk_add').addEventListener('click', function () {
        var d = val('sk_date'); if (!d) { toast('Choose a date', true); return; }
        var cur = skipDates().filter(function (x) { return x.date !== d; }); cur.push({ date: d, note: val('sk_note') }); save(cur);
      });
      on(box, '[data-skd]', 'click', function (e) { var d = e.currentTarget.getAttribute('data-skd'); save(skipDates().filter(function (x) { return x.date !== d; })); });
      $('sk_fill').addEventListener('click', function () { call('refreshSchedule', {}).then(function (r) { S.d.lists = r.lists; toast('Schedule refreshed: ' + r.created + ' created, ' + r.removed + ' empty removed'); render(); }).catch(fail); });
      if (!can('lists')) { $('sk_add').disabled = true; $('sk_fill').disabled = true; }
    }
    paint();
  };
})();


// ---- v0.12.5: type to search the procedure instead of scrolling the drop-down
(function () {
  function enhance(sel) {
    if (!sel || sel.getAttribute('data-q')) return;
    sel.setAttribute('data-q', '1');
    var opts = [].slice.call(sel.options).filter(function (o) { return o.value !== ''; });
    var dl = document.createElement('datalist'); dl.id = 'f_proc_dl';
    dl.innerHTML = opts.map(function (o) { return '<option value="' + esc(o.text) + '"></option>'; }).join('');
    var inp = document.createElement('input'); inp.type = 'text'; inp.id = 'f_procq'; inp.setAttribute('list', 'f_proc_dl');
    inp.setAttribute('autocomplete', 'off'); inp.placeholder = 'Type to search the procedure…';
    function cur() { var o = sel.options[sel.selectedIndex]; return o && o.value !== '' ? o.text : ''; }
    inp.value = cur();
    function pick(o) { if (sel.value !== o.value) { sel.value = o.value; sel.dispatchEvent(new Event('change', { bubbles: true })); } }
    function find(t, loose) {
      t = t.trim().toLowerCase(); if (!t) return null;
      var ex = opts.filter(function (o) { return o.text.toLowerCase() === t; })[0]; if (ex) return ex;
      if (!loose) return null;
      var m = opts.filter(function (o) { return o.text.toLowerCase().indexOf(t) >= 0; });
      return m.length === 1 ? m[0] : null;
    }
    inp.addEventListener('input', function () { var o = find(inp.value, false); if (o) pick(o); });
    inp.addEventListener('change', function () {
      var o = find(inp.value, true);
      if (o) { pick(o); inp.value = o.text; }
      else { sel.value = ''; sel.dispatchEvent(new Event('change', { bubbles: true })); if (inp.value.trim()) toast('No single procedure matches. Keep typing, or pick from the suggestions.'); }
    });
    inp.addEventListener('focus', function () { inp.select(); });
    sel.addEventListener('change', function () { if (document.activeElement !== inp) inp.value = cur(); });
    sel.style.display = 'none';
    sel.parentNode.insertBefore(dl, sel); sel.parentNode.insertBefore(inp, sel);
    var lb = sel.parentNode.querySelector('label[for="f_proc"]'); if (lb) lb.setAttribute('for', 'f_procq');
  }
  new MutationObserver(function () { var s = document.getElementById('f_proc'); if (s && s.tagName === 'SELECT') enhance(s); }).observe(document.body, { childList: true, subtree: true });
})();
init();
})();
